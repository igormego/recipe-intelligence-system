schema_version: "0.2"

state_scope: "project_rollup"

project:
  name: "Recipe Intelligence System"
  owner: "Core Project Brain rollup"

status: "active"
phase: "social-acquisition-spike"

current_gate: >
  Agent Contract v1.1 and Resolver Service v1 remain the approved guarded-autonomy
  contracts. Structural main-component normalization and DB-enforced evidence
  fingerprint uniqueness are live and verified. The active gate is now social
  acquisition: select and acceptance-test a legitimate Instagram/Facebook
  acquisition path before implementing Resolver Service runtime.

current_state: >
  Data & Platform Architecture remains the single active specialist-owned
  workstream. Supabase is ACTIVE_HEALTHY. The creator pilot is dispositioned at
  19 promoted, 4 duplicate and 2 intentional needs_review holds. Sixteen promoted
  recipes now use canonical main_component concept links and the culinary concept
  count is 74. recipe_inbox_evidence now has a database-generated SHA-256
  evidence_fingerprint with NOT NULL and unique-index enforcement; all 44
  pre-existing evidence rows were preserved and duplicate/distinct behavior was
  verified transactionally without changing RLS/grants. The social spike proved
  Firecrawl direct scraping unsupported for Instagram and Facebook and found no
  indexed match for three sampled Instagram Reels. Bright Data and Apify are
  candidates but have not been project-accepted. manual_context remains the
  explicit fallback. A manual cooking-chat recovery handoff was also added to the
  repo as a context artifact; it does not create a new active workstream.

exact_next_action: >
  Run a bounded authorized live provider test using Bright Data and/or Apify on
  public Reel/post URLs. Verify source identity, creator/caption metadata,
  transcript availability, provenance, cost, permissions and failure behavior
  before selecting the social adapter. Do not use personal social-login
  credentials.

blockers:
  - "No current Supabase availability or schema blocker."
  - "Instagram/Facebook production acquisition provider remains unselected and unaccepted."
  - "Miso Ramen and the partial 2024 Gochujang Noodles source remain intentional non-blocking review holds."

workstreams:
  - id: "data-platform-architecture"
    path: ".project/workstreams/data-platform-architecture.yaml"
    owner: "Recipe Intelligence technical specialist chat"
    status: "active"
  - id: "product-intelligence"
    path: ".project/workstreams/product-intelligence.yaml"
    owner: "unassigned"
    status: "future_unassigned"

rollup_policy:
  specialist_writes_root: false
  generated_from:
    - ".project/workstreams/data-platform-architecture.yaml"
  future_workstreams_do_not_block_rollup: true

portfolio:
  milestone: true
  signal: >
    Recipe Intelligence now combines guarded human-in-the-loop ingestion with
    DB-enforced evidence idempotency, concept-first semantic modeling, a real
    creator-scale pilot and an explicit resolver boundary. The next meaningful
    milestone is a legitimate social adapter and accepted Resolver runtime, not
    further manual batch expansion.

verification:
  last_verified: "2026-10-20"
  sources:
    - ".project/workstreams/data-platform-architecture.yaml"
    - ".project/workstreams/product-intelligence.yaml"
    - "Repository manual cooking-chat recovery handoff commits on 2026-10-22 (context artifact only)"

sync:
  status: "synced"
  storage: ".project/state.yaml"
